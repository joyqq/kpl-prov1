      gap: 10px;
      margin-bottom: 14px;
    }

      padding: 10px 12px;
      font-size: 14px;
      outline: none;
    }
    .toolbar input:focus {
      border-color: #6366f1;
      box-shadow: 0 0 0 3px rgba(99,102,241,.12);

      overflow: auto;

      flex: 1;

    .empty {
      color: #6b7280;
      line-height: 1.7;
      padding: 8px 2px;

    .role-box {
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 10px;
      background: #ffffff;
    }
    .role-title {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 8px;
    }
    .role-items {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .role-item {
      background: #f3f4f6;
      border-radius: 999px;
      padding: 4px 10px;
      color: #374151;
      font-size: 13px;
      line-height: 1.5;
    }
    @media (max-width: 900px) {

      '北京市': '北京',
      '天津市': '天津',
      '上海市': '上海',
      '重庆市': '重庆',
      '内蒙古自治区': '内蒙古',

      const province = normalizeProvince(player.province);
      if (!acc[province]) acc[province] = [];
      acc[province].push({ ...player, province });
      return acc;
    }, {});

    const mapData = Object.entries(grouped).map(([name, list]) => ({
      name,
      value: list.length
    }));

    const chart = echarts.init(document.getElementById('map'), null, { renderer: 'canvas' });

        min: 0,
        max: maxValue,
        left: 20,
        bottom: 20,
        text: ['人数多', '人数少'],

        }
      },
      series: [{
        type: 'map',
        map: 'china',
        roam: true,
        zoom: 1.1,
        selectedMode: 'single',
        label: {
          show: true,
          fontSize: 10,
          color: '#334155',
          lineHeight: 13,
          formatter: (params) => {
            const province = normalizeProvince(params.name || '');
            const count = grouped[province]?.length || 0;
            return `${province}
${count}`;
          }
        },
        emphasis: {
          label: {
            color: '#111827',
            formatter: (params) => {
              const province = normalizeProvince(params.name || '');
              const count = grouped[province]?.length || 0;
              return `${province}
${count}`;
            }
          },
          itemStyle: { areaColor: '#ffd166' }
        },
        itemStyle: {
          borderColor: '#ffffff',
          borderWidth: 1,
          areaColor: '#f3f4f6'
        },
        data: mapData
      }]
    };

    chart.setOption(option);

    const provinceTitle = document.getElementById('provinceTitle');
    const provinceCount = document.getElementById('provinceCount');
    const currentPlayers = document.getElementById('currentPlayers');
    const totalPlayers = document.getElementById('totalPlayers');
    const coveredProvinces = document.getElementById('coveredProvinces');
    const playerList = document.getElementById('playerList');
    const keywordInput = document.getElementById('keywordInput');

    totalPlayers.textContent = players.length;
    coveredProvinces.textContent = Object.keys(grouped).length;

    let currentProvince = null;

    const roleOrder = ['对抗路', '打野', '中路', '发育路', '游走'];

    function renderPlayers(province, keyword = '') {
      const all = grouped[province] || [];
      const key = keyword.trim().toLowerCase();
      const filtered = !key ? all : all.filter(p =>
        [p.name, p.team, p.role].some(v => String(v).toLowerCase().includes(key))
      );

      provinceTitle.textContent = province || '未选择省份';
      provinceCount.textContent = `${all.length} 人`;
      currentPlayers.textContent = all.length;

      if (!province) {
        playerList.innerHTML = '<div class="empty">先点地图中的一个省份。<br />电脑端可以鼠标点击，手机端可以直接点按。</div>';
        return;
      }
	  
	  // 新增：该省本来就没有选手
      if (!all.length) {
        playerList.innerHTML = '<div class="empty">暂无该籍贯选手。</div>';
        return;
      }

      if (!filtered.length) {
        playerList.innerHTML = '<div class="empty">这个省份有选手，但当前搜索词没有匹配结果。</div>';
        return;
      }

      const roleGroups = roleOrder.map(role => ({
  role,
  players: filtered.filter(player => player.role === role)
}));

playerList.innerHTML = roleGroups.map(group => `
  <div class="role-box">
    <div class="role-title">${group.role}</div>
    <div class="role-items">
      ${
        group.players.length
          ? group.players.map(player => `<span class="role-item">${player.team}-${player.name}</span>`).join('')
          : `<span class="role-empty">0</span>`
      }
    </div>
  </div>
`).join('');
    }

    chart.on('click', function (params) {
      currentProvince = normalizeProvince(params.name || '');
      renderPlayers(currentProvince, keywordInput.value);
    });

    keywordInput.addEventListener('input', () => {
      renderPlayers(currentProvince, keywordInput.value);
    });

    window.addEventListener('resize', () => chart.resize());
  </script>
</body>
</html>
